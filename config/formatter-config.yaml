# Excel 格式统一工具 - 配置文件
# 版本：1.0.0

# ==================== 纸张设置 ====================
paper:
  # 纸张尺寸：A4, A3, Letter, Legal
  size: A4
  
  # 方向模式：auto, portrait, landscape
  # auto: 根据内容宽度自动判断 (>19cm 则横向)
  # portrait: 强制纵向
  # landscape: 强制横向
  orientation: auto
  
  # 自动横向阈值 (单位：cm)
  landscape_threshold: 19

# ==================== 页面边距 ====================
margins:
  # 上边距 (单位：cm)
  top: 1.5
  
  # 下边距 (单位：cm)
  bottom: 1.5
  
  # 左边距 (单位：cm)
  left: 1.8
  
  # 右边距 (单位：cm)
  right: 1.8
  
  # 页眉边距 (单位：cm)
  header: 0.5
  
  # 页脚边距 (单位：cm)
  footer: 0.5

# ==================== 字体设置 ====================
font:
  # 主字体
  family: "Microsoft YaHei"
  
  # 回退字体
  fallback: "SimSun"
  
  # 表头字体设置
  header:
    size: 12      # 字号 (pt)
    bold: true    # 加粗
    italic: false # 斜体
    
  # 数据字体设置
  data:
    size: 10      # 字号 (pt)
    bold: false   # 加粗
    italic: false # 斜体
    
  # 注释字体设置
  note:
    size: 9       # 字号 (pt)
    bold: false   # 加粗
    italic: true  # 斜体
    
  # 注释行识别关键词
  note_keywords:
    - "注"
    - "备注"
    - "comment"
    - "note"

# ==================== 排版布局 ====================
layout:
  # 解合并单元格
  unmerge:
    enable: true
    # 填充模式：previous_row (使用上一行对应列的值)
    fill_mode: previous_row
    
  # 列宽模式：auto, fixed, custom
  column_width:
    mode: auto
    # 最小列宽 (字符数)
    min_width: 8
    # 最大列宽 (字符数)
    max_width: 50
    # 自定义列宽 (当 mode=custom 时使用，单位：字符)
    custom_widths: []
    
  # 边框样式
  border:
    # 边框类型：thin(细实线), medium(中等), thick(粗), dashed(虚线), dotted(点线)
    style: thin
    # 边框颜色 (十六进制)
    color: "#999999"
    
  # 对齐方式
  alignment:
    # 水平对齐：left, center, right, auto
    # auto: 文本左对齐，数值右对齐
    horizontal: auto
    
    # 垂直对齐：top, middle, bottom
    vertical: middle
    
  # 自动换行
  wrap_text: true

# ==================== 冻结窗格 ====================
freeze:
  # 是否启用冻结
  enable: true
  
  # 冻结位置 (Excel 格式，如 "A2", "B3")
  # A2: 冻结首行
  # B2: 冻结首行和首列
  # C3: 冻结前两行和前两列
  pane: "A2"

# ==================== 打印缩放 ====================
print:
  # 是否启用自适应缩放
  enable: true
  
  # 适应页宽 (1 表示缩放至 1 页宽)
  fit_to_width: 1
  
  # 适应页高 (0 表示不限制高度)
  fit_to_height: 0
  
  # 缩放比例 (0-100，0 表示自动)
  scale: 0
  
  # 打印质量：draft(草稿), normal(正常), high(高)
  quality: normal

# ==================== 列处理策略 ====================
columns:
  # 自动显示列选择器的列数阈值
  show_selector_threshold: 8
  
  # 默认隐藏空列
  hide_empty_columns: false
  
  # 列显示顺序：original(原始), alphabetical(字母顺序), custom(自定义)
  order: original
  
  # 自定义列顺序 (当 order=custom 时使用)
  custom_order: []

# ==================== 预设配置 ====================
# 可选择的预设模板
presets:
  # 标准报表
  standard:
    paper:
      orientation: auto
    margins:
      top: 1.5
      bottom: 1.5
      left: 1.8
      right: 1.8
    font:
      header:
        size: 12
        bold: true
      data:
        size: 10
        
  # 宽表报表 (适合多列)
  wide_table:
    paper:
      orientation: landscape
    margins:
      top: 1.0
      bottom: 1.0
      left: 1.0
      right: 1.0
    font:
      header:
        size: 10
        bold: true
      data:
        size: 9
        
  # 紧凑型 (节省空间)
  compact:
    paper:
      orientation: auto
    margins:
      top: 1.0
      bottom: 1.0
      left: 1.2
      right: 1.2
    font:
      header:
        size: 11
        bold: true
      data:
        size: 9
    layout:
      border:
        style: thin
        
  # 正式文档
  formal:
    paper:
      orientation: portrait
    margins:
      top: 2.0
      bottom: 2.0
      left: 2.5
      right: 2.5
    font:
      family: "SimSun"
      header:
        size: 14
        bold: true
      data:
        size: 12

# ==================== 预设应用 ====================
# 当前使用的预设 (可选值：standard, wide_table, compact, formal, custom)
# custom: 使用上方自定义配置
active_preset: custom
